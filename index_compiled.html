<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PEMINJAMAN ALAT EVENT – PECC POLINES</title>
  <meta name="description" content="Sistem Reservasi & Cek Ketersediaan Alat Event PECC Politeknik Negeri Semarang secara Real-Time. Desain Neobrutalism cepat, responsif, dan mudah."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800;900&family=Public+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800;900&family=Public+Sans:wght@400;600;700;800;900&display=swap');

:root {
  /* Colors */
  --bg-color: #e0f2fe;        /* Soft Sky Blue */
  --dot-color: #93c5fd;
  --pecc-blue: #1d4ed8;       /* Primary PECC Blue */
  --pecc-blue-hover: #1e40af;
  --shopee-orange: #ff5722;   /* Shopee Accent */
  --shopee-orange-hover: #e64a19;
  --neo-yellow: #ffde00;      /* Neo-brutalism Accent */
  --neo-green: #22c55e;
  --neo-green-soft: #dcfce7;
  --neo-red: #ef4444;
  --neo-red-soft: #fee2e2;
  --black: #0f172a;           /* Dark Slate Stroke */
  --white: #ffffff;
  --gray-50: #f8fafc;
  --gray-100: #f1f5f9;
  --gray-200: #e2e8f0;
  --gray-400: #94a3b8;
  --gray-600: #475569;
  
  /* Borders & Shadows */
  --border-width: 3px;
  --border-radius: 8px;
  --border-radius-sm: 4px;
  --border-radius-pill: 9999px;
  --shadow-sm: 3px 3px 0px 0px var(--black);
  --shadow-main: 5px 5px 0px 0px var(--black);
  --shadow-hover: 7px 7px 0px 0px var(--black);
  --shadow-active: 1px 1px 0px 0px var(--black);
  --shadow-lg: 9px 9px 0px 0px var(--black);
  
  --transition: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Public Sans', system-ui, -apple-system, sans-serif;
  color: var(--black);
  background-color: var(--bg-color);
  background-image: radial-gradient(var(--dot-color) 2px, transparent 2px);
  background-size: 24px 24px;
  min-height: 100vh;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* Custom Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg-color); }
::-webkit-scrollbar-thumb { background: var(--pecc-blue); border-radius: 4px; border: 2px solid var(--black); }

/* TOP ANNOUNCEMENT TICKER (Ala Shopee) */
.ticker-bar {
  background: var(--black);
  color: var(--neo-yellow);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.8rem;
  font-weight: 800;
  padding: 0.4rem 1rem;
  overflow: hidden;
  white-space: nowrap;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 2px solid var(--neo-yellow);
}
.ticker-content {
  display: inline-flex;
  gap: 2rem;
  animation: tickerScroll 32s linear infinite;
}
@keyframes tickerScroll {
  0% { transform: translateX(100%); }
  100% { transform: translateX(-100%); }
}

/* NAVBAR */
.navbar {
  background: var(--white);
  border-bottom: var(--border-width) solid var(--black);
  position: sticky;
  top: 0;
  z-index: 99;
  box-shadow: 0 4px 0 var(--black);
}
.navbar-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0.75rem 1.25rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}
.nav-brand {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  text-decoration: none;
  color: inherit;
  cursor: pointer;
}
.nav-logos {
  display: flex;
  align-items: center;
  gap: 0.4rem;
}
.nav-logo-box {
  width: 42px;
  height: 42px;
  border: var(--border-width) solid var(--black);
  border-radius: var(--border-radius-sm);
  background: var(--white);
  box-shadow: 2px 2px 0 var(--black);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.nav-logo-box img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.nav-brand-text h1 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1.15rem;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: -0.5px;
  line-height: 1.1;
  color: var(--black);
}
.nav-brand-text p {
  font-size: 0.72rem;
  font-weight: 800;
  color: var(--pecc-blue);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* Shopee Search Box */
.nav-search-wrap {
  flex: 1;
  max-width: 480px;
  position: relative;
}
.nav-search-input {
  width: 100%;
  padding: 0.65rem 1rem 0.65rem 2.5rem;
  border: var(--border-width) solid var(--black);
  border-radius: var(--border-radius);
  font-family: 'Public Sans', sans-serif;
  font-size: 0.88rem;
  font-weight: 700;
  background: var(--gray-50);
  box-shadow: 3px 3px 0 var(--black);
  outline: none;
  transition: all var(--transition);
}
.nav-search-input:focus {
  background: var(--white);
  box-shadow: 4px 4px 0 var(--pecc-blue);
  border-color: var(--black);
}
.nav-search-icon {
  position: absolute;
  left: 0.85rem;
  top: 50%;
  transform: translateY(-50%);
  font-size: 1rem;
  pointer-events: none;
}

/* Nav Actions */
.nav-actions {
  display: flex;
  align-items: center;
  gap: 0.6rem;
}
.nav-btn {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 800;
  font-size: 0.82rem;
  text-transform: uppercase;
  padding: 0.55rem 0.9rem;
  border: var(--border-width) solid var(--black);
  border-radius: var(--border-radius);
  background: var(--white);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  text-decoration: none;
  color: var(--black);
  transition: all var(--transition);
}
.nav-btn:hover {
  transform: translate(-2px, -2px);
  box-shadow: var(--shadow-main);
  background: var(--neo-yellow);
}
.nav-btn:active {
  transform: translate(1px, 1px);
  box-shadow: var(--shadow-active);
}
.nav-btn.primary {
  background: var(--shopee-orange);
  color: var(--white);
}
.nav-btn.primary:hover {
  background: var(--shopee-orange-hover);
  color: var(--white);
}
.nav-btn.admin-toggle {
  background: var(--neo-yellow);
}
.cart-badge-count {
  background: var(--black);
  color: var(--neo-yellow);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.72rem;
  font-weight: 900;
  padding: 0.15rem 0.45rem;
  border-radius: var(--border-radius-pill);
  min-width: 18px;
  text-align: center;
  border: 1px solid var(--black);
}

/* MAIN CONTAINER */
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 2rem 1.25rem 7rem 1.25rem;
}

/* FORM HEADER SECTION (Neo-Brutalism KOP SURAT) */
.form-header-card {
  background: var(--white);
  border: var(--border-width) solid var(--black);
  border-radius: var(--border-radius);
  box-shadow: var(--shadow-lg);
  padding: 2rem;
  margin-bottom: 2rem;
  position: relative;
  text-align: center;
}
.header-top-tag {
  position: absolute;
  top: -14px;
  left: 24px;
  background: var(--pecc-blue);
  color: var(--white);
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 800;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 0.3rem 0.9rem;
  border: var(--border-width) solid var(--black);
  border-radius: var(--border-radius-sm);
  box-shadow: 2px 2px 0 var(--black);
}
.header-logos {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 1.25rem;
  margin-bottom: 1rem;
}
.header-logo-box {
  width: 68px;
  height: 68px;
  border: var(--border-width) solid var(--black);
  border-radius: var(--border-radius);
  background: var(--white);
  padding: 0.4rem;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  justify-content: center;
}
.header-logo-box img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.form-header-card h1 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 2.1rem;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: -0.5px;
  line-height: 1.15;
  color: var(--black);
  margin-bottom: 0.4rem;
}
.form-header-card .subtitle {
  font-size: 1rem;
  font-weight: 700;
  color: var(--gray-600);
  max-width: 720px;
  margin: 0 auto 1.25rem auto;
}
.form-header-badges {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 0.6rem;
}
.badge-pill {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.75rem;
  font-weight: 800;
  text-transform: uppercase;
  padding: 0.3rem 0.8rem;
  border: 2px solid var(--black);
  border-radius: var(--border-radius-pill);
  background: var(--gray-100);
  box-shadow: 2px 2px 0 var(--black);
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
}
.badge-pill.yellow { background: var(--neo-yellow); }
.badge-pill.green { background: var(--neo-green-soft); color: #15803d; }
.badge-pill.blue { background: #dbeafe; color: var(--pecc-blue); }

/* DATE AVAILABILITY CHECKER BAR (Fitur Utama Cek Ketersediaan & Stok) */
.availability-checker-card {
  background: var(--white);
  border: var(--border-width) solid var(--black);
  border-radius: var(--border-radius);
  box-shadow: var(--shadow-main);
  padding: 1.5rem;
  margin-bottom: 2rem;
  position: relative;
}
.checker-tag {
  position: absolute;
  top: -14px;
  left: 20px;
  background: var(--shopee-orange);
  color: var(--white);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.75rem;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 0.25rem 0.8rem;
  border: var(--border-width) solid var(--black);
  border-radius: var(--border-radius-sm);
  box-shadow: 2px 2px 0 var(--black);
}
.checker-grid {
  display: grid;
  grid-template-columns: 1fr 1fr auto auto;
  gap: 1rem;
  align-items: flex-end;
}
.form-field label {
  display: block;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.82rem;
  font-weight: 800;
  text-transform: uppercase;
  margin-bottom: 0.35rem;
  color: var(--black);
}
.form-field input, .form-field select {
  width: 100%;
  padding: 0.65rem 0.85rem;
  font-family: 'Public Sans', sans-serif;
  font-size: 0.9rem;
  font-weight: 700;
  border: var(--border-width) solid var(--black);
  border-radius: var(--border-radius-sm);
  background: var(--gray-50);
  box-shadow: 3px 3px 0 var(--black);
  outline: none;
  transition: all var(--transition);
}
.form-field input:focus, .form-field select:focus {
  background: var(--white);
  box-shadow: 4px 4px 0 var(--pecc-blue);
}
.btn-checker {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.85rem;
  font-weight: 900;
  text-transform: uppercase;
  padding: 0.72rem 1.25rem;
  background: var(--neo-yellow);
  color: var(--black);
  border: var(--border-width) solid var(--black);
  border-radius: var(--border-radius-sm);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  white-space: nowrap;
  transition: all var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
}
.btn-checker:hover {
  transform: translate(-2px, -2px);
  box-shadow: var(--shadow-main);
  background: #facc15;
}
.btn-checker:active {
  transform: translate(1px, 1px);
  box-shadow: var(--shadow-active);
}
.checker-result-notice {
  margin-top: 1rem;
  padding: 0.75rem 1rem;
  background: #eff6ff;
  border: 2px dashed var(--pecc-blue);
  border-radius: var(--border-radius-sm);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.5rem;
  font-size: 0.85rem;
  font-weight: 700;
}
.checker-result-notice span strong {
  color: var(--pecc-blue);
}

/* CATEGORY & FILTER TABS (Shopee Style) */
.filter-tabs-wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
}
.category-chips {
  display: flex;
  gap: 0.5rem;
  overflow-x: auto;
  padding-bottom: 0.4rem;
  scrollbar-width: none;
}
.category-chips::-webkit-scrollbar { display: none; }
.chip-btn {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.8rem;
  font-weight: 800;
  text-transform: uppercase;
  padding: 0.5rem 0.9rem;
  border: var(--border-width) solid var(--black);
  border-radius: var(--border-radius-pill);
  background: var(--white);
  box-shadow: 2px 2px 0 var(--black);
  cursor: pointer;
  white-space: nowrap;
  transition: all var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
}
.chip-btn:hover {
  transform: translate(-1px, -1px);
  box-shadow: 3px 3px 0 var(--black);
  background: var(--gray-100);
}
.chip-btn.active {
  background: var(--pecc-blue);
  color: var(--white);
  box-shadow: 3px 3px 0 var(--black);
}
.sort-wrap {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.8rem;
  font-weight: 800;
}
.sort-select {
  padding: 0.45rem 0.85rem;
  font-family: 'Public Sans', sans-serif;
  font-size: 0.82rem;
  font-weight: 700;
  border: 2px solid var(--black);
  border-radius: var(--border-radius-sm);
  background: var(--white);
  box-shadow: 2px 2px 0 var(--black);
  outline: none;
  cursor: pointer;
}

/* PRODUCTS GRID (Shopee Marketplace Cards) */
.products-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 1.5rem;
}
.product-card {
  background: var(--white);
  border: var(--border-width) solid var(--black);
  border-radius: var(--border-radius);
  box-shadow: var(--shadow-main);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: transform var(--transition), box-shadow var(--transition);
  position: relative;
}
.product-card:hover {
  transform: translate(-3px, -3px);
  box-shadow: var(--shadow-hover);
}
.product-card.out-of-stock {
  opacity: 0.82;
  filter: grayscale(0.2);
}

/* Product Card Photo */
.product-img-box {
  width: 100%;
  height: 200px;
  background: #f8fafc;
  border-bottom: var(--border-width) solid var(--black);
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.product-img-box img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  padding: 0.75rem;
  background: #fff;
  transition: transform 0.25s ease;
}
.product-card:hover .product-img-box img {
  transform: scale(1.06);
}
.tag-badge-top {
  position: absolute;
  top: 10px;
  left: 10px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.68rem;
  font-weight: 900;
  text-transform: uppercase;
  padding: 0.2rem 0.55rem;
  border: 2px solid var(--black);
  border-radius: var(--border-radius-sm);
  background: var(--shopee-orange);
  color: var(--white);
  box-shadow: 2px 2px 0 var(--black);
  z-index: 2;
}
.tag-badge-top.yellow {
  background: var(--neo-yellow);
  color: var(--black);
}
.btn-quick-view {
  position: absolute;
  bottom: 8px;
  right: 8px;
  background: rgba(255, 255, 255, 0.95);
  border: 2px solid var(--black);
  border-radius: var(--border-radius-sm);
  padding: 0.25rem 0.55rem;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.72rem;
  font-weight: 800;
  box-shadow: 2px 2px 0 var(--black);
  cursor: pointer;
  z-index: 2;
  transition: all var(--transition);
}
.btn-quick-view:hover {
  background: var(--neo-yellow);
}

/* Product Card Body */
.product-body {
  padding: 1.15rem;
  display: flex;
  flex-direction: column;
  flex: 1;
}
.product-category-text {
  font-size: 0.72rem;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--pecc-blue);
  letter-spacing: 0.5px;
  margin-bottom: 0.2rem;
}
.product-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1.05rem;
  font-weight: 800;
  line-height: 1.25;
  color: var(--black);
  margin-bottom: 0.5rem;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  height: 2.5rem;
}
.product-price-row {
  margin-bottom: 0.75rem;
  display: flex;
  align-items: baseline;
  gap: 0.4rem;
}
.price-currency {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1.3rem;
  font-weight: 900;
  color: var(--shopee-orange);
}
.price-unit {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--gray-600);
}

/* Real-Time Stock Status Badges */
.product-stock-banner {
  padding: 0.4rem 0.65rem;
  border-radius: var(--border-radius-sm);
  border: 2px solid var(--black);
  margin-bottom: 0.85rem;
  font-size: 0.76rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.product-stock-banner.available {
  background: var(--neo-green-soft);
  color: #15803d;
}
.product-stock-banner.limited {
  background: #fef3c7;
  color: #b45309;
}
.product-stock-banner.empty {
  background: var(--neo-red-soft);
  color: #b91c1c;
}

/* Card Action Buttons */
.product-actions {
  margin-top: auto;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 0.5rem;
}
.btn-add-cart {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.82rem;
  font-weight: 800;
  text-transform: uppercase;
  padding: 0.65rem 0.8rem;
  background: var(--pecc-blue);
  color: var(--white);
  border: 2px solid var(--black);
  border-radius: var(--border-radius-sm);
  box-shadow: 2px 2px 0 var(--black);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  transition: all var(--transition);
}
.btn-add-cart:hover:not(:disabled) {
  background: var(--shopee-orange);
  transform: translate(-1px, -1px);
  box-shadow: 3px 3px 0 var(--black);
}
.btn-add-cart:disabled {
  background: var(--gray-200);
  color: var(--gray-400);
  cursor: not-allowed;
  box-shadow: none;
}
.btn-detail-item {
  padding: 0.65rem 0.75rem;
  background: var(--white);
  border: 2px solid var(--black);
  border-radius: var(--border-radius-sm);
  box-shadow: 2px 2px 0 var(--black);
  cursor: pointer;
  font-size: 0.95rem;
  transition: all var(--transition);
}
.btn-detail-item:hover {
  background: var(--neo-yellow);
  transform: translate(-1px, -1px);
}

/* EMPTY STATE */
.empty-state-box {
  grid-column: 1 / -1;
  background: var(--white);
  border: var(--border-width) solid var(--black);
  border-radius: var(--border-radius);
  box-shadow: var(--shadow-main);
  padding: 3rem 1.5rem;
  text-align: center;
}
.empty-state-box .icon {
  font-size: 3.5rem;
  margin-bottom: 0.75rem;
}
.empty-state-box h3 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1.3rem;
  font-weight: 800;
  text-transform: uppercase;
  margin-bottom: 0.4rem;
}
.empty-state-box p {
  color: var(--gray-600);
  font-weight: 600;
  font-size: 0.9rem;
  margin-bottom: 1.25rem;
}

/* STICKY FLOATING CART BAR (Shopee Style) */
.shopee-float-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--white);
  border-top: var(--border-width) solid var(--black);
  box-shadow: 0 -4px 0 var(--black);
  z-index: 90;
  padding: 0.85rem 1.25rem;
  animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes slideUp {
  0% { transform: translateY(100%); }
  100% { transform: translateY(0); }
}
.float-bar-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
}
.float-bar-left {
  display: flex;
  align-items: center;
  gap: 1rem;
}
.float-cart-icon-btn {
  width: 48px;
  height: 48px;
  border: var(--border-width) solid var(--black);
  border-radius: var(--border-radius);
  background: var(--neo-yellow);
  box-shadow: 3px 3px 0 var(--black);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.3rem;
  position: relative;
  cursor: pointer;
  transition: all var(--transition);
}
.float-cart-icon-btn:hover {
  transform: scale(1.05);
}
.float-cart-count-badge {
  position: absolute;
  top: -8px;
  right: -8px;
  background: var(--shopee-orange);
  color: var(--white);
  border: 2px solid var(--black);
  border-radius: var(--border-radius-pill);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.72rem;
  font-weight: 900;
  padding: 0.1rem 0.45rem;
  min-width: 22px;
  text-align: center;
  box-shadow: 1px 1px 0 var(--black);
}
.float-bar-summary h4 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.95rem;
  font-weight: 800;
  line-height: 1.2;
}
.float-bar-summary p {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--gray-600);
}
.float-bar-right {
  display: flex;
  align-items: center;
  gap: 1.25rem;
}
.float-total-box {
  text-align: right;
}
.float-total-label {
  font-size: 0.75rem;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--gray-600);
}
.float-total-amount {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1.35rem;
  font-weight: 900;
  color: var(--shopee-orange);
  line-height: 1;
}
.btn-checkout-float {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.95rem;
  font-weight: 900;
  text-transform: uppercase;
  padding: 0.8rem 1.6rem;
  background: var(--shopee-orange);
  color: var(--white);
  border: var(--border-width) solid var(--black);
  border-radius: var(--border-radius);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: all var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
}
.btn-checkout-float:hover {
  background: var(--shopee-orange-hover);
  transform: translate(-2px, -2px);
  box-shadow: var(--shadow-main);
}
.btn-checkout-float:active {
  transform: translate(1px, 1px);
  box-shadow: var(--shadow-active);
}

/* MODAL SYSTEM (Neo-Brutalism Overlays) */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.7);
  backdrop-filter: blur(4px);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.25rem;
  animation: fadeIn 0.2s ease;
  overflow-y: auto;
}
@keyframes fadeIn {
  0% { opacity: 0; }
  100% { opacity: 1; }
}
.modal-container {
  background: var(--white);
  border: var(--border-width) solid var(--black);
  border-radius: var(--border-radius);
  box-shadow: var(--shadow-lg);
  width: 100%;
  max-width: 600px;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  animation: popScale 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.modal-container.large {
  max-width: 860px;
}
@keyframes popScale {
  0% { opacity: 0; transform: scale(0.94) translateY(15px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-header {
  background: var(--pecc-blue);
  color: var(--white);
  padding: 1rem 1.25rem;
  border-bottom: var(--border-width) solid var(--black);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-header h3 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1.15rem;
  font-weight: 900;
  text-transform: uppercase;
}
.modal-close-btn {
  background: var(--neo-yellow);
  color: var(--black);
  border: 2px solid var(--black);
  border-radius: var(--border-radius-sm);
  width: 32px;
  height: 32px;
  font-size: 1rem;
  font-weight: 900;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 2px 2px 0 var(--black);
  transition: all var(--transition);
}
.modal-close-btn:hover {
  background: var(--neo-red);
  color: var(--white);
  transform: translate(-1px, -1px);
}
.modal-body {
  padding: 1.5rem;
  overflow-y: auto;
  flex: 1;
}
.modal-footer {
  padding: 1rem 1.5rem;
  border-top: var(--border-width) solid var(--black);
  background: var(--gray-50);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 0.75rem;
}

/* DETAIL PRODUK MODAL */
.detail-grid {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 1.5rem;
}
.detail-photo-box {
  width: 100%;
  height: 240px;
  border: var(--border-width) solid var(--black);
  border-radius: var(--border-radius-sm);
  background: #fff;
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.detail-photo-box img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.detail-info-box h2 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1.4rem;
  font-weight: 900;
  margin-bottom: 0.4rem;
}
.detail-price-tag {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1.5rem;
  font-weight: 900;
  color: var(--shopee-orange);
  margin-bottom: 1rem;
}
.detail-specs-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
  margin-bottom: 1rem;
}
.detail-specs-table td {
  padding: 0.45rem 0.6rem;
  border-bottom: 1.5px solid var(--gray-200);
}
.detail-specs-table td.label {
  font-weight: 800;
  color: var(--gray-600);
  width: 35%;
}
.detail-specs-table td.val {
  font-weight: 700;
  color: var(--black);
}

/* FORM SECTIONS (Tema Seperti Form) */
.form-section {
  background: var(--white);
  border: var(--border-width) solid var(--black);
  border-radius: var(--border-radius);
  box-shadow: var(--shadow-main);
  padding: 1.75rem;
  margin-bottom: 1.75rem;
  position: relative;
}
.section-tag {
  position: absolute;
  top: -14px;
  left: 20px;
  background: var(--pecc-blue);
  color: var(--white);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.78rem;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 0.25rem 0.85rem;
  border: var(--border-width) solid var(--black);
  border-radius: var(--border-radius-sm);
  box-shadow: 2px 2px 0 var(--black);
}
.form-grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}
.form-grid-3 {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 1rem;
}
.form-group {
  margin-bottom: 1.15rem;
}
.form-group:last-child {
  margin-bottom: 0;
}
.form-label {
  display: block;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.82rem;
  font-weight: 800;
  text-transform: uppercase;
  margin-bottom: 0.35rem;
  color: var(--black);
}
.form-label .req {
  color: var(--shopee-orange);
}
.form-input, .form-textarea, .form-select {
  width: 100%;
  padding: 0.7rem 0.9rem;
  font-family: 'Public Sans', sans-serif;
  font-size: 0.9rem;
  font-weight: 700;
  border: var(--border-width) solid var(--black);
  border-radius: var(--border-radius-sm);
  background: var(--gray-50);
  box-shadow: 3px 3px 0 var(--black);
  outline: none;
  transition: all var(--transition);
}
.form-input:focus, .form-textarea:focus, .form-select:focus {
  background: var(--white);
  box-shadow: 4px 4px 0 var(--pecc-blue);
}

/* CART ITEMS TABLE & LIST */
.cart-items-table {
  width: 100%;
  border-collapse: collapse;
}
.cart-items-table th {
  background: var(--gray-100);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.8rem;
  font-weight: 800;
  text-transform: uppercase;
  padding: 0.75rem 0.85rem;
  border-bottom: 2px solid var(--black);
  text-align: left;
}
.cart-items-table td {
  padding: 0.85rem 0.85rem;
  border-bottom: 1.5px solid var(--gray-200);
  vertical-align: middle;
}
.cart-item-info {
  display: flex;
  align-items: center;
  gap: 0.85rem;
}
.cart-item-thumb {
  width: 52px;
  height: 52px;
  border: 2px solid var(--black);
  border-radius: var(--border-radius-sm);
  background: #fff;
  padding: 0.2rem;
  object-fit: contain;
  flex-shrink: 0;
}
.cart-item-name {
  font-weight: 800;
  font-size: 0.92rem;
  line-height: 1.2;
}
.cart-item-unit-price {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--gray-600);
}
.qty-stepper {
  display: inline-flex;
  align-items: center;
  border: 2px solid var(--black);
  border-radius: var(--border-radius-sm);
  overflow: hidden;
  box-shadow: 2px 2px 0 var(--black);
}
.qty-btn {
  width: 32px;
  height: 32px;
  background: var(--white);
  border: none;
  border-right: 2px solid var(--black);
  cursor: pointer;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1.1rem;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background var(--transition);
}
.qty-btn:last-child {
  border-right: none;
  border-left: 2px solid var(--black);
}
.qty-btn:hover {
  background: var(--neo-yellow);
}
.qty-val {
  width: 36px;
  text-align: center;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.9rem;
  font-weight: 800;
  background: var(--gray-50);
}
.btn-delete-cart {
  background: var(--neo-red-soft);
  color: #b91c1c;
  border: 2px solid var(--black);
  border-radius: var(--border-radius-sm);
  padding: 0.35rem 0.65rem;
  cursor: pointer;
  font-size: 0.85rem;
  box-shadow: 2px 2px 0 var(--black);
  transition: all var(--transition);
}
.btn-delete-cart:hover {
  background: var(--neo-red);
  color: #fff;
  transform: translate(-1px, -1px);
}

/* QRIS & PAYMENT SECTION */
.qris-card-wrap {
  display: flex;
  align-items: center;
  gap: 1.5rem;
  flex-wrap: wrap;
}
.qris-box {
  width: 220px;
  background: var(--white);
  border: var(--border-width) solid var(--black);
  border-radius: var(--border-radius);
  box-shadow: var(--shadow-sm);
  padding: 0.75rem;
  text-align: center;
  cursor: pointer;
  transition: all var(--transition);
}
.qris-box:hover {
  transform: scale(1.03);
  box-shadow: var(--shadow-main);
}
.qris-box img {
  width: 100%;
  height: auto;
  border: 2px solid var(--black);
  border-radius: var(--border-radius-sm);
}
.qris-box p {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.72rem;
  font-weight: 800;
  text-transform: uppercase;
  margin-top: 0.4rem;
  color: var(--pecc-blue);
}

/* FILE UPLOAD ZONE */
.upload-dropzone {
  border: 3px dashed var(--black);
  border-radius: var(--border-radius);
  background: var(--gray-50);
  padding: 1.5rem;
  text-align: center;
  cursor: pointer;
  transition: all var(--transition);
}
.upload-dropzone:hover {
  background: #f0fdf4;
  border-color: var(--neo-green);
}
.upload-dropzone.has-file {
  background: var(--neo-green-soft);
  border-style: solid;
  border-color: var(--black);
}
.preview-img-box {
  max-width: 240px;
  margin: 1rem auto 0 auto;
  border: 2px solid var(--black);
  border-radius: var(--border-radius-sm);
  box-shadow: 3px 3px 0 var(--black);
  overflow: hidden;
}
.preview-img-box img {
  width: 100%;
  height: auto;
  display: block;
}

/* OFFICIAL NOTA / INVOICE (Neo-Brutalism Style) */
.nota-paper {
  background: var(--white);
  border: var(--border-width) solid var(--black);
  border-radius: var(--border-radius);
  box-shadow: var(--shadow-lg);
  padding: 2rem;
  position: relative;
  max-width: 650px;
  margin: 0 auto;
}
.nota-header {
  text-align: center;
  border-bottom: 3px dashed var(--black);
  padding-bottom: 1.25rem;
  margin-bottom: 1.25rem;
}
.nota-id-badge {
  display: inline-block;
  background: var(--neo-yellow);
  color: var(--black);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.85rem;
  font-weight: 900;
  padding: 0.35rem 0.9rem;
  border: 2px solid var(--black);
  border-radius: var(--border-radius-sm);
  box-shadow: 2px 2px 0 var(--black);
  margin-top: 0.5rem;
}
.nota-row {
  display: flex;
  justify-content: space-between;
  padding: 0.45rem 0;
  border-bottom: 1.5px solid var(--gray-200);
  font-size: 0.88rem;
}
.nota-row .label {
  color: var(--gray-600);
  font-weight: 700;
}
.nota-row .val {
  font-weight: 800;
  text-align: right;
}
.nota-items-summary {
  margin: 1rem 0;
  background: var(--gray-50);
  border: 2px solid var(--black);
  border-radius: var(--border-radius-sm);
  padding: 0.85rem;
}
.nota-total-box {
  background: var(--neo-yellow);
  border: var(--border-width) solid var(--black);
  border-radius: var(--border-radius-sm);
  padding: 1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 3px 3px 0 var(--black);
  margin-top: 1.25rem;
}
.nota-total-box .total-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1rem;
  font-weight: 900;
  text-transform: uppercase;
}
.nota-total-box .total-val {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1.4rem;
  font-weight: 900;
  color: var(--black);
}

/* BUTTONS */
.btn {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.88rem;
  font-weight: 800;
  text-transform: uppercase;
  padding: 0.65rem 1.25rem;
  border: var(--border-width) solid var(--black);
  border-radius: var(--border-radius);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  text-decoration: none;
  transition: all var(--transition);
}
.btn:hover {
  transform: translate(-2px, -2px);
  box-shadow: var(--shadow-main);
}
.btn:active {
  transform: translate(1px, 1px);
  box-shadow: var(--shadow-active);
}
.btn-primary { background: var(--pecc-blue); color: var(--white); }
.btn-primary:hover { background: var(--pecc-blue-hover); color: var(--white); }
.btn-orange { background: var(--shopee-orange); color: var(--white); }
.btn-orange:hover { background: var(--shopee-orange-hover); color: var(--white); }
.btn-yellow { background: var(--neo-yellow); color: var(--black); }
.btn-green { background: #22c55e; color: var(--white); }
.btn-secondary { background: var(--white); color: var(--black); }
.btn-danger { background: var(--neo-red); color: var(--white); }
.btn-full { width: 100%; }

/* TOAST NOTIFICATION */
.toast-container {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 999;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}
.toast {
  background: var(--white);
  border: var(--border-width) solid var(--black);
  border-radius: var(--border-radius);
  box-shadow: var(--shadow-main);
  padding: 0.75rem 1.15rem;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.88rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  animation: slideInRight 0.25s ease;
}
@keyframes slideInRight {
  0% { transform: translateX(100%); opacity: 0; }
  100% { transform: translateX(0); opacity: 1; }
}
.toast.success { border-left: 8px solid var(--neo-green); }
.toast.error { border-left: 8px solid var(--neo-red); }
.toast.info { border-left: 8px solid var(--pecc-blue); }

/* ==========================================
   RESPONSIVE DESIGN BREAKPOINTS (ALL DEVICES)
   ========================================== */

/* Tablets & Small Laptops (max-width: 1024px) */
@media (max-width: 1024px) {
  .container {
    padding: 1.5rem 1rem 8rem 1rem;
  }
  .products-grid {
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1.25rem;
  }
  .product-img-box {
    height: 175px;
  }
}

/* Medium Tablets & Large Phones (max-width: 820px) */
@media (max-width: 820px) {
  .checker-grid {
    grid-template-columns: 1fr 1fr;
  }
  .btn-checker {
    grid-column: 1 / -1;
    justify-content: center;
  }
  .detail-grid {
    grid-template-columns: 1fr;
    gap: 1rem;
  }
  .detail-photo-box {
    height: 200px;
  }
  .form-grid-2, .form-grid-3 {
    grid-template-columns: 1fr;
  }
  .qris-card-wrap {
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .qris-box {
    width: 240px;
    max-width: 100%;
  }
}

/* Mobile Smartphones (max-width: 640px) */
@media (max-width: 640px) {
  /* Ticker */
  .ticker-bar {
    font-size: 0.72rem;
    padding: 0.35rem 0.5rem;
  }

  /* Navbar */
  .navbar-inner {
    padding: 0.55rem 0.75rem;
    gap: 0.5rem;
  }
  .nav-logo-box {
    width: 36px;
    height: 36px;
  }
  .nav-brand-text h1 {
    font-size: 0.98rem;
  }
  .nav-brand-text p {
    display: none; /* Hide subtitle to keep navbar clean on small screens */
  }
  .nav-search-wrap {
    order: 3;
    width: 100%;
    max-width: 100%;
    margin-top: 0.4rem;
  }
  .navbar-inner {
    flex-wrap: wrap;
  }
  .nav-actions {
    gap: 0.4rem;
  }
  .nav-btn {
    padding: 0.45rem 0.65rem;
    font-size: 0.75rem;
  }

  /* Header Card */
  .form-header-card {
    padding: 1.5rem 0.85rem;
    margin-bottom: 1.25rem;
  }
  .header-logos {
    gap: 0.75rem;
    margin-bottom: 0.75rem;
  }
  .header-logo-box {
    width: 52px;
    height: 52px;
  }
  .form-header-card h1 {
    font-size: 1.4rem;
    line-height: 1.2;
  }
  .form-header-card .subtitle {
    font-size: 0.88rem;
    margin-bottom: 1rem;
  }
  .header-top-tag {
    font-size: 0.68rem;
    left: 12px;
    padding: 0.2rem 0.6rem;
  }

  /* Checker */
  .availability-checker-card {
    padding: 1.25rem 0.85rem;
    margin-bottom: 1.25rem;
  }
  .checker-tag {
    font-size: 0.68rem;
    left: 12px;
    padding: 0.2rem 0.6rem;
  }
  .checker-grid {
    grid-template-columns: 1fr;
    gap: 0.75rem;
  }
  .btn-checker {
    width: 100%;
  }

  /* Filter Tabs */
  .filter-tabs-wrap {
    flex-direction: column;
    align-items: stretch;
    gap: 0.75rem;
    margin-bottom: 1rem;
  }
  .category-chips {
    width: 100%;
    padding-bottom: 0.25rem;
  }
  .sort-wrap {
    justify-content: space-between;
    width: 100%;
  }
  .sort-select {
    flex: 1;
    max-width: 220px;
  }

  /* Products Grid (2 Columns on Mobile for Shopee Vibe!) */
  .products-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 0.75rem;
  }
  .product-img-box {
    height: 140px;
  }
  .product-body {
    padding: 0.75rem 0.65rem;
  }
  .product-title {
    font-size: 0.85rem;
    height: 2.2rem;
    line-height: 1.25;
    margin-bottom: 0.35rem;
  }
  .product-price-row {
    margin-bottom: 0.5rem;
  }
  .price-currency {
    font-size: 1.05rem;
  }
  .price-unit {
    font-size: 0.7rem;
  }
  .product-stock-banner {
    font-size: 0.68rem;
    padding: 0.3rem 0.45rem;
    margin-bottom: 0.65rem;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.15rem;
  }
  .product-actions {
    grid-template-columns: 1fr auto;
    gap: 0.35rem;
  }
  .btn-add-cart {
    font-size: 0.72rem;
    padding: 0.55rem 0.4rem;

// ==========================================
// GOOGLE SPREADSHEET SYNC ENGINE
// ==========================================
/**
 * Menyinkronkan data peminjaman dari Google Spreadsheet
 */
async function syncWithGoogleSheets(isSilent = false) {
  if (!state.appsScriptUrl) {
    if (!isSilent) toast('Silakan masukkan URL Web App Google Apps Script terlebih dahulu!', 'error');
    return;
  }
  
  state.isSyncing = true;
  if (!isSilent) toast('Menghubungi Google Spreadsheet...', 'info');
  
  try {
    const sep = state.appsScriptUrl.includes('?') ? '&' : '?';
    const targetUrl = `${state.appsScriptUrl}${sep}action=getAll&nocache=${Date.now()}`;
    
    const response = await fetch(targetUrl);
    const data = await response.json();
    
    if (data && data.status === 'success') {
      let syncedCount = 0;
      
      // Sinkronkan daftar peminjaman
      if (Array.isArray(data.loans)) {
        data.loans.forEach(sheetLoan => {
          const idx = state.loans.findIndex(l => l.id === sheetLoan.id);
          
          // Pastikan items memiliki struktur array
          if (!sheetLoan.items && sheetLoan.itemsSummary) {
            sheetLoan.items = parseItemsSummary(sheetLoan.itemsSummary);
          }
          
          if (idx !== -1) {
            state.loans[idx] = { ...state.loans[idx], ...sheetLoan };
          } else {
            state.loans.unshift(sheetLoan);
          }
          syncedCount++;
        });
        saveLoans();
      }
      
      // Sinkronkan master stok jika ada di Spreadsheet
      if (Array.isArray(data.items) && data.items.length > 0) {
        data.items.forEach(sheetItem => {
          const it = state.items.find(i => i.id === sheetItem.id);
          if (it) {
            if (sheetItem.stock !== undefined) it.stock = sheetItem.stock;
            if (sheetItem.price !== undefined) it.price = sheetItem.price;
          }
        });
        saveItems();
      }
      
      state.isOnlineWithSheets = true;
      if (!isSilent) toast(`✅ Berhasil terhubung ke Google Spreadsheet! (${syncedCount} transaksi disinkronkan)`, 'success');
      
      refreshCatalogGrid();
      if (state.view === 'admin') render();
    } else {
      if (!isSilent) toast('Gagal mengambil data Spreadsheet: ' + (data.message || 'Respons tidak valid'), 'error');
    }
  } catch (err) {
    console.warn('Sync Google Sheets error:', err);
    if (!isSilent) {
      toast('Koneksi gagal. Pastikan deployment Web App diset ke "Who has access: Anyone"!', 'error');
    }
  } finally {
    state.isSyncing = false;
  }
}

/**
 * Mengirim transaksi baru langsung ke Google Spreadsheet & Google Drive
 */
async function sendLoanToGoogleSheets(loanRecord) {
  if (!state.appsScriptUrl) return;
  
  try {
    // 1. Jika berjalan langsung di Google Apps Script HTML
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          toast('☁️ Peminjaman tersimpan di Google Spreadsheet & Drive!', 'success');
        })
        .withFailureHandler(function(err) {
          console.error('Error Google Script run:', err);
        })
        .processLoanSubmission(loanRecord);
      return;
    }
    
    // 2. Jika dipanggil dari web browser biasa via fetch POST (no-cors)
    await fetch(state.appsScriptUrl, {
      method: 'POST',
      mode: 'no-cors',
      headers: {
        'Content-Type': 'text/plain'
      },
      body: JSON.stringify(loanRecord)
    });
    
    toast('☁️ Data peminjaman otomatis dicatat ke Google Spreadsheet!', 'success');
  } catch (err) {
    console.error('Gagal mengirim ke Google Sheets:', err);
  }
}

/**
 * Helper untuk mem-parsing text rincian alat dari Spreadsheet menjadi array
 */
function parseItemsSummary(summaryStr) {
  if (!summaryStr) return [];
  const parts = summaryStr.split(',');
  return parts.map(p => {
    const trimmed = p.trim();
    const match = trimmed.match(/^(.*?)\s*\(x(\d+)/i);
    if (match) {
      const name = match[1].trim();
      const qty = parseInt(match[2], 10) || 1;
      const matched = state.items.find(i => i.name.toLowerCase().includes(name.toLowerCase()));
      return {
        itemId: matched ? matched.id : ('itm-' + name.slice(0, 5).toLowerCase()),
        name: name,
        qty: qty,
        price: matched ? matched.price : 10000
      };
    }
    return { itemId: 'itm-custom', name: trimmed, qty: 1, price: 10000 };
  });
}

// ==========================================
// CORE AVAILABILITY & STOCK ENGINE
// ==========================================
function getAvailableStock(itemId, startDateStr, endDateStr) {
  const item = state.items.find(i => i.id === itemId);
  if (!item || !item.available) return 0;
  
  const sStart = startDateStr || state.filterStartDate;
  const sEnd = endDateStr || state.filterEndDate;
  
  let bookedCount = 0;
  state.loans.forEach(loan => {
    if (loan.status !== 'active') return;
    
    const lStart = loan.borrowDate;
    const lEnd = loan.returnDate;
    
    // Check overlap: (sStart <= lEnd) && (sEnd >= lStart)
    const isOverlap = (sStart <= lEnd) && (sEnd >= lStart);
    if (isOverlap) {
      if (Array.isArray(loan.items)) {
        const match = loan.items.find(it => it.itemId === itemId);
        if (match) bookedCount += match.qty;
      }
    }
  });
  
  const remaining = item.stock - bookedCount;
  return Math.max(0, remaining);
}

function getItemBookings(itemId) {
  const bookings = [];
  state.loans.forEach(loan => {
    if (loan.status !== 'active') return;
    if (Array.isArray(loan.items)) {
      const found = loan.items.find(i => i.itemId === itemId);
      if (found) {
        bookings.push({
          loanId: loan.id,
          borrower: loan.borrowerName,
          event: loan.eventName || 'Acara Kampus',
          start: loan.borrowDate,
          end: loan.returnDate,
          qty: found.qty
        });
      }
    }
  });
  return bookings;
}

function toast(msg, type = 'info') {
  let c = document.getElementById('toasts');
  if (!c) {
    c = document.createElement('div');
    c.id = 'toasts';
    c.className = 'toast-container no-print';
    document.body.appendChild(c);
  }
  const icons = { success: '✅', error: '❌', info: '⚡' };
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${icons[type] || 'ℹ️'}</span> <span>${msg}</span>`;
  c.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    setTimeout(() => el.remove(), 250);
  }, 3500);
}

function updateDateFilter(newStart, newEnd) {
  if (newStart) state.filterStartDate = newStart;
  if (newEnd) state.filterEndDate = newEnd;
  
  if (state.filterEndDate < state.filterStartDate) {
    state.filterEndDate = state.filterStartDate;
  }
  
  const endInput = document.getElementById('date-end');
  if (endInput) {
    endInput.min = state.filterStartDate;
    endInput.value = state.filterEndDate;
  }
  
  validateCartStock();
  refreshCatalogGrid();
}

function applyDateFilter() {
  toast(`Jadwal ketersediaan diperbarui untuk ${fmtDate(state.filterStartDate)} s/d ${fmtDate(state.filterEndDate)}!`, 'success');
  refreshCatalogGrid();
}

function resetTodayFilter() {
  state.filterStartDate = getTodayStr();
  state.filterEndDate = getTomorrowStr();
  render();
  toast('Jadwal dikembalikan ke hari ini.', 'info');
}

function setCategory(catId) {
  state.selectedCategory = catId;
  render();
}

function setSort(sortVal) {
  state.sortBy = sortVal;
  refreshCatalogGrid();
}

function validateCartStock() {
  let changed = false;
  state.cart.forEach(c => {
    const avail = getAvailableStock(c.itemId, state.filterStartDate, state.filterEndDate);
    if (c.qty > avail) {
      c.qty = Math.max(0, avail);
      changed = true;
    }
  });
  if (changed) {
    state.cart = state.cart.filter(c => c.qty > 0);
    toast('Jumlah di keranjang disesuaikan dengan stok tersedia pada tanggal baru!', 'info');
  }
}

function updateCartUI() {
  const totalUnits = state.cart.reduce((s, c) => s + c.qty, 0);
  
  // 1. Update badge angka di navbar
  const counter = document.getElementById('cart-counter');
  if (counter) {
    counter.textContent = totalUnits;
  }
  
  // 2. Update / pasang floating bar di bagian bawah
  const existingBar = document.getElementById('float-cart-bar');
  if (existingBar) existingBar.remove();
  
  if (state.view === 'catalog' && state.cart.length > 0) {
    const app = document.getElementById('app');
    if (app) {
      app.appendChild(renderFloatingCartBar());
    }
  }
}

function refreshCatalogGrid() {
  const grid = document.getElementById('products-grid');
  if (grid) renderProductCards(grid);
  updateCartUI();
}

// ==========================================
// RENDER PRODUCT CARDS
// ==========================================
function renderProductCards(gridEl) {
  let list = [...state.items];
  
  if (state.selectedCategory !== 'all') {
    list = list.filter(i => i.category === state.selectedCategory);
  }
  
  if (state.searchQuery) {
    list = list.filter(i => 
      i.name.toLowerCase().includes(state.searchQuery) ||
      (i.desc && i.desc.toLowerCase().includes(state.searchQuery))
    );
  }
  
  if (state.sortBy === 'price-asc') {
    list.sort((a, b) => a.price - b.price);
  } else if (state.sortBy === 'price-desc') {
    list.sort((a, b) => b.price - a.price);
  } else if (state.sortBy === 'stock-desc') {
    list.sort((a, b) => {
      const aStock = getAvailableStock(a.id, state.filterStartDate, state.filterEndDate);
      const bStock = getAvailableStock(b.id, state.filterStartDate, state.filterEndDate);
      return bStock - aStock;
    });
  }
  
  if (list.length === 0) {
    gridEl.innerHTML = `
      <div class="empty-state-box">
        <div class="icon">🔍</div>
        <h3>Alat Tidak Ditemukan</h3>
        <p>Tidak ada alat yang sesuai dengan pencarian atau filter yang dipilih.</p>
        <button class="btn btn-primary" onclick="resetFilters()">Reset Filter Pencarian</button>
      </div>
    `;
    return;
  }
  
  gridEl.innerHTML = list.map(item => {
    const availStock = getAvailableStock(item.id, state.filterStartDate, state.filterEndDate);
    const inCart = state.cart.find(c => c.itemId === item.id);
    const cartQty = inCart ? inCart.qty : 0;
    
    let stockBanner = '';
    let isOutOfStock = false;
    
    if (availStock <= 0) {
      isOutOfStock = true;
      stockBanner = `
        <div class="product-stock-banner empty">
          <span>🔴 Habis di Tanggal Ini</span>
          <span>0/${item.stock} Unit</span>
        </div>
      `;
    } else if (availStock <= 2) {
      stockBanner = `
        <div class="product-stock-banner limited">
          <span>⚠️ Sisa ${availStock} Unit (Terbatas!)</span>
          <span>${availStock}/${item.stock} Unit</span>
        </div>
      `;
    } else {
      stockBanner = `
        <div class="product-stock-banner available">
          <span>🟢 Tersedia</span>
          <span>Sisa ${availStock}/${item.stock} Unit</span>
        </div>
      `;
    }
    
    const tagHtml = item.tag ? `
      <div class="tag-badge-top ${item.tagColor === 'yellow' ? 'yellow' : ''}">${item.tag}</div>
    ` : '';
    
    return `
      <div class="product-card ${isOutOfStock ? 'out-of-stock' : ''}">
        <div class="product-img-box" onclick="openProductQuickView('${item.id}')">
          ${tagHtml}
          <img src="${item.image || 'pecc_logo.jpg'}" alt="${item.name}" onerror="this.src='pecc_logo.jpg'"/>
          <button class="btn-quick-view" title="Lihat detail">👁️ Detail</button>
        </div>
        
        <div class="product-body">
          <div class="product-category-text">${item.categoryLabel || 'Alat Event'}</div>
          <h3 class="product-title" title="${item.name}" onclick="openProductQuickView('${item.id}')" style="cursor:pointer">
            ${item.name}
          </h3>
          
          <div class="product-price-row">
            <span class="price-currency">${fmt(item.price)}</span>
            <span class="price-unit">/ hari</span>
          </div>
          
          ${stockBanner}
          
          <div class="product-actions">
            ${isOutOfStock ? `
              <button class="btn-add-cart" disabled>
                ❌ Penuh
              </button>
            ` : (inCart ? `
              <button class="btn-add-cart" style="background:var(--shopee-orange)" onclick="openCartModal()">
                ✅ Masuk (${cartQty})
              </button>
            ` : `
              <button class="btn-add-cart" onclick="addToCart('${item.id}')">
                🛒 + Keranjang
              </button>
            `)}
            <button class="btn-detail-item" onclick="openScheduleModal('${item.id}')" title="Cek jadwal booking alat ini">
              📅
            </button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function resetFilters() {
  state.searchQuery = '';
  state.selectedCategory = 'all';
  const searchInput = document.getElementById('global-search');
  if (searchInput) searchInput.value = '';
  render();
}

// ==========================================
// CART OPERATIONS
// ==========================================
function addToCart(itemId) {
  const item = state.items.find(i => i.id === itemId);
  if (!item) return;
  
  const avail = getAvailableStock(itemId, state.filterStartDate, state.filterEndDate);
  if (avail <= 0) {
    toast(`Maaf, ${item.name} habis untuk tanggal yang dipilih!`, 'error');
    return;
  }
  
  const existing = state.cart.find(c => c.itemId === itemId);
  if (existing) {
    if (existing.qty < avail) {
      existing.qty += 1;
      toast(`Jumlah ${item.name} ditambah (${existing.qty})`, 'success');
    } else {
      toast(`Maksimal hanya tersedia ${avail} unit di tanggal ini!`, 'error');
    }
  } else {
    state.cart.push({
      itemId: item.id,
      name: item.name,
      price: item.price,
      image: item.image,
      qty: 1
    });
    toast(`+ ${item.name} masuk keranjang!`, 'success');
  }
  
  refreshCatalogGrid();
}

function changeCartQty(itemId, delta) {
  const item = state.items.find(i => i.id === itemId);
  const cartItem = state.cart.find(c => c.itemId === itemId);
  if (!cartItem) return;
  
  const avail = getAvailableStock(itemId, state.filterStartDate, state.filterEndDate);
  const newQty = cartItem.qty + delta;
  
  if (newQty <= 0) {
    removeFromCart(itemId);
    return;
  }
  
  if (newQty > avail) {
    toast(`Maksimal ${avail} unit tersedia untuk tanggal yang dipilih!`, 'error');
    return;
  }
  
  cartItem.qty = newQty;
  renderCartModalContent();
  refreshCatalogGrid();
}

function removeFromCart(itemId) {
  state.cart = state.cart.filter(c => c.itemId !== itemId);
  toast('Item dihapus dari keranjang.', 'info');
  renderCartModalContent();
  refreshCatalogGrid();
}

  overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
  
  const bookingRows = bookings.length > 0 ? bookings.map(b => `
    <tr>
      <td><strong>${fmtDate(b.start)} s/d ${fmtDate(b.end)}</strong></td>
      <td>${b.borrower}</td>

function handleCheckoutDateChange(start, end) {
  if (start) state.filterStartDate = start;
  if (end) state.filterEndDate = end;
  
  if (state.filterEndDate < state.filterStartDate) {
    state.filterEndDate = state.filterStartDate;
  }
  
  validateCartStock();
  render();
}

function handleProofUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  
  state.proofName = file.name;
  
  if (file.type.startsWith('image/')) {
    const reader = new FileReader();
    reader.onload = ev => {
      state.proofImg = ev.target.result;
      const prevBox = document.getElementById('proof-preview-box');
      const prevImg = document.getElementById('proof-preview-img');
      const dzText = document.getElementById('dropzone-text');
      const dz = document.getElementById('dropzone');
      if (prevBox && prevImg) {
        prevBox.style.display = 'block';
        prevImg.src = ev.target.result;
      }
      if (dzText) dzText.textContent = '✅ File Terpilih: ' + file.name;
      if (dz) dz.classList.add('has-file');
    };
    reader.readAsDataURL(file);
  } else {
    state.proofImg = 'PDF_DOCUMENT';
    const dzText = document.getElementById('dropzone-text');
    if (dzText) dzText.textContent = '✅ File Dokumen PDF: ' + file.name;
  }
  toast('Bukti transfer berhasil dipilih!', 'success');
}

async function submitLoanForm() {
  const name = document.getElementById('inp-name')?.value.trim();
  const nim = document.getElementById('inp-nim')?.value.trim();
  const org = document.getElementById('inp-org')?.value.trim();
  const phone = document.getElementById('inp-phone')?.value.trim();
  const event = document.getElementById('inp-event')?.value.trim();
  
  if (!name || !nim || !org || !phone || !event) {
    toast('Harap lengkapi semua data identitas peminjam!', 'error');
    return;
  }
  
  if (!state.proofImg) {
    toast('Harap unggah bukti pembayaran transfer/QRIS!', 'error');
    return;
  }
  
  for (const c of state.cart) {
    const avail = getAvailableStock(c.itemId, state.filterStartDate, state.filterEndDate);
    if (c.qty > avail) {
      toast(`Maaf, stok ${c.name} tidak cukup (${avail} unit tersedia)!`, 'error');
      return;
    }
  }
  
  const days = diffDays(state.filterStartDate, state.filterEndDate);
  const totalDayPrice = state.cart.reduce((s, c) => s + (c.price * c.qty), 0);
  const grandTotal = totalDayPrice * days;
  
  const loanRecord = {
    id: uid('NOTA'),
    borrowerName: name,
    borrowerNIM: nim,
    borrowerOrg: org,
    borrowerPhone: phone,
    eventName: event,
    borrowDate: state.filterStartDate,
    returnDate: state.filterEndDate,
    days: days,
    totalPrice: grandTotal,
    status: 'active',
    items: state.cart.map(c => ({
      itemId: c.itemId,
      name: c.name,
      qty: c.qty,
      price: c.price
    })),
    proof: state.proofImg,
    proofName: state.proofName,
    createdAt: Date.now()
  };
  
  // 1. Simpan di cache lokal
  state.loans.unshift(loanRecord);
  saveLoans();
  
  // 2. Kirim langsung ke Google Spreadsheet & Drive
  sendLoanToGoogleSheets(loanRecord);
  
  state.currentNota = loanRecord;
  state.cart = [];
  state.proofImg = '';
  state.proofName = '';
  
  toast('Peminjaman berhasil diproses!', 'success');
  switchView('nota');
}

  localStorage.setItem('pecc_event_apps_script_url', val);
  toast('URL Google Spreadsheet berhasil disimpan!', 'success');
  if (val) {
    syncWithGoogleSheets(false);
  }
}

function doAdminLogin() {
  const u = document.getElementById('adm-user')?.value.trim();
  const p = document.getElementById('adm-pass')?.value;
  if (u === 'admin' && p === 'admin123') {
    state.adminLoggedIn = true;
    toast('Berhasil masuk sebagai Admin!', 'success');
    render();
  } else {
    toast('Username atau password salah! (admin / admin123)', 'error');
  }
}

function adminLogout() {
  state.adminLoggedIn = false;
  toast('Keluar dari mode admin.', 'info');
  switchView('catalog');
}

async function markLoanReturned(id) {
  const loan = state.loans.find(l => l.id === id);
  if (!loan) return;
  loan.status = 'returned';
  saveLoans();
  
  if (state.appsScriptUrl) {
    try {
      fetch(state.appsScriptUrl, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'markReturned', loanId: id })
      });
      toast(`Status #${id} diperbarui di Spreadsheet & lokal!`, 'success');
    } catch (e) {
      toast(`Status #${id} diperbarui (cache lokal)!`, 'success');
    }
  } else {
    toast(`Peminjaman #${id} ditandai sudah kembali. Stok otomatis pulih!`, 'success');
  }
  render();
}

function previewNotaById(id) {
  const loan = state.loans.find(l => l.id === id);
  if (!loan) return;
  state.currentNota = loan;
  switchView('nota');
}

function exportLoansCSV() {
  if (!state.loans.length) {
    toast('Belum ada data peminjaman!', 'error');
    return;
  }
  const headers = ['ID Nota', 'Peminjam', 'NIM', 'Organisasi', 'No WA', 'Acara', 'Tgl Pinjam', 'Tgl Kembali', 'Durasi', 'Total Biaya', 'Status'];
  const rows = state.loans.map(l => [
    l.id,
    l.borrowerName,
    l.borrowerNIM,
    l.borrowerOrg,
    l.borrowerPhone,
    l.eventName,
    l.borrowDate,
    l.returnDate,
    l.days + ' Hari',
    l.totalPrice,
    l.status === 'active' ? 'Dipinjam' : 'Dikembalikan'
  ]);
  const csv = '\uFEFF' + [headers, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `peminjaman-pecc-${getTodayStr()}.csv`;
  a.click();
  toast('Data berhasil diexport ke CSV / Excel!', 'success');
}

function saveItemData(id) {
  const name = document.getElementById('edit-name')?.value.trim();
  const cat = document.getElementById('edit-cat')?.value;
  const tag = document.getElementById('edit-tag')?.value.trim();
  const price = parseInt(document.getElementById('edit-price')?.value) || 0;
  const stock = parseInt(document.getElementById('edit-stock')?.value) || 1;
  const desc = document.getElementById('edit-desc')?.value.trim();
  
  if (!name || price <= 0) {
    toast('Nama dan harga alat harus diisi!', 'error');
    return;
  }
  
  const catLabels = {
    sound: 'Sound & Audio',
    tech: 'Visual & Tech',
    atribut: 'Atribut Acara',
    dekorasi: 'Dekorasi Meja'
  };
  
  if (id) {
    const item = state.items.find(i => i.id === id);
    if (item) {
      item.name = name;
      item.category = cat;
      item.categoryLabel = catLabels[cat] || 'Alat Event';
      item.tag = tag;
      item.price = price;
      item.stock = stock;
      item.desc = desc;
      toast('Alat berhasil diperbarui!', 'success');
    }
  } else {
    state.items.push({
      id: 'itm-' + Date.now(),
      name,
      category: cat,
      categoryLabel: catLabels[cat] || 'Alat Event',
      tag,
      tagColor: 'yellow',
      price,
      stock,
      desc,
      available: true,
      image: 'images/speaker.jpg'
    });
    toast('Alat baru berhasil ditambahkan!', 'success');
  }
  
  saveItems();
  document.getElementById('item-edit-modal')?.remove();
  render();
}

function deleteItem(id) {
  if (!confirm('Yakin ingin menghapus alat ini dari inventaris?')) return;
  state.items = state.items.filter(i => i.id !== id);
  saveItems();
  toast('Alat berhasil dihapus!', 'info');
  render();
}
